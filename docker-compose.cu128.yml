# 用法（在仓库根目录）：
#   docker compose -f docker-compose.cu128.yml up -d --build
# 打开 http://localhost:8010  （Web UI / API）
#
# 两个服务：
#   sakura  —— 本地中日翻译大模型（llama.cpp + Sakura GGUF，OpenAI 兼容接口）
#   engine  —— manga-image-translator 的 FastAPI 网关 + worker
# 引擎通过 SAKURA_API_BASE=http://sakura:8080/v1 访问它（同一 compose 网络，按服务名互访）
#
# 注意：上游自带的 docker-compose.yml 只构建 front（React 前端），不含翻译引擎。

services:
  # ---------- 本地 Sakura 翻译模型（JP -> ZH） ----------
  sakura:
    # 默认不启动（compose profile）。要启用中文翻译时：
    #   docker compose -f docker-compose.cu128.yml --profile sakura up -d
    profiles: ["sakura"]
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: sakura-llm
    command: >
      -m /models/sakura-1.5b-qwen2.5-v1.0-fp16.gguf
      --host 0.0.0.0 --port 8080
      -c 4096 -t 16 --no-warmup
    volumes:
      - "${MIT_SAKURA_MODELS:-D:/models/sakura}:/models"
    ports:
      - "127.0.0.1:8080:8080"     # 仅本机可访问，防止被外网当免费 API 用
    restart: unless-stopped

  # ---------- manga-image-translator 引擎 ----------
  engine:
    build:
      context: .
      dockerfile: Dockerfile.cu128
      args:
        BASE_IMAGE: ${BASE_IMAGE:-pytorch/pytorch:2.8.0-cuda12.8-cudnn9-runtime}
    image: mit:cu128
    container_name: mit-engine

    # server/main.py = FastAPI 网关（默认 8000），--start-instance 会自己拉一个
    # 常驻 worker（manga_translator shared，内部端口 8001），模型只加载一次
    entrypoint: ["python", "server/main.py"]
    command: ["--host", "0.0.0.0", "--port", "8000", "--start-instance", "--use-gpu"]

    ports:
      - "${MIT_PORT:-8010}:8000"

    volumes:
      - "${MIT_MODELS:-D:/models/mit}:/app/models"
      - "${MIT_INPUT:-D:/mit-work/input}:/input"
      - "${MIT_OUTPUT:-D:/mit-work/output}:/output"

    environment:
      HF_HOME: /app/models/hf
      # 全程绕开 huggingface.co：走 hf-mirror + 关掉 xet 桥 + 改写硬编码直链
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
      HF_URL_MIRROR: ${HF_URL_MIRROR:-https://hf-mirror.com}
      HF_HUB_DISABLE_XET: "1"
      # 连本地 Sakura 服务（compose 网络内按服务名解析）
      SAKURA_API_BASE: http://sakura:8080/v1
      # 0.10 会带上术语表（适合 Qwen2.5 版 1.5B/7B 模型）；老 13B galgame 模型用 0.9
      SAKURA_VERSION: "0.10"
      # 需要在线翻译器时才用得上；不用就把这两行删掉/注释
      HTTP_PROXY: ${MIT_PROXY:-http://host.docker.internal:7897}
      HTTPS_PROXY: ${MIT_PROXY:-http://host.docker.internal:7897}
      NO_PROXY: localhost,127.0.0.1,sakura

    extra_hosts:
      - "host.docker.internal:host-gateway"

    shm_size: 2gb
    restart: unless-stopped

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
