# 跑在你的 VPS 上：把 https://mit.example.com 反代到 frps 暴露的 8020 端口
# 放进 nginx 的 conf.d/（比如 /etc/nginx/conf.d/mit.conf），然后 nginx -s reload

server {
    listen 443 ssl http2;
    server_name mit.example.com;              # 改成你的域名

    # 证书（用 certbot 申请：certbot certonly --nginx -d mit.example.com）
    ssl_certificate     /etc/letsencrypt/live/mit.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mit.example.com/privkey.pem;

    # 全书翻译一次会上传很多页图
    client_max_body_size 200m;

    location / {
        proxy_pass http://127.0.0.1:8020;     # frps 在本机暴露的端口
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # App 用 async 模式，正常都是短请求；放宽以防万一
        proxy_connect_timeout 60s;
        proxy_send_timeout    1200s;
        proxy_read_timeout    1200s;

        proxy_request_buffering off;
        proxy_buffering         off;
    }
}
