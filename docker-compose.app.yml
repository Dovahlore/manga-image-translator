# ============================================================
#  这个文件已经并入 docker-compose.full.yml
#  （引擎 + MySQL + Redis + App 接口，一条命令起全套）
#
#  保留本文件是为了让老的命令不至于跑错东西：
#      docker compose --env-file app.env -f docker-compose.app.yml up -d
#  效果与 -f docker-compose.full.yml 完全一致（就是 include 了它）。
#
#  推荐直接写：
#      .\mit-app.ps1 up            # 封装脚本，参数都替你带好了
#      docker compose --env-file app.env -f docker-compose.full.yml up -d
# ============================================================
include:
  - docker-compose.full.yml
