name: OpenHands 自动修 Bug

# 触发方式：
#   - 给 issue 打 "fix-me" 标签 → 修整个 issue
#   - 评论 @openhands-agent → 只针对该评论修
# 结果：OpenHands 用 DeepSeek 跑 agent，开一个 draft PR（不会直接改 main，等你 review 合并）
on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request:
    types: [labeled]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  resolve:
    if: |
      github.event.label.name == 'fix-me' ||
      (github.event.comment && contains(github.event.comment.body, '@openhands-agent')) ||
      (github.event.review && contains(github.event.review.body, '@openhands-agent'))
    uses: All-Hands-AI/OpenHands/.github/workflows/openhands-resolver.yml@main
    with:
      macro: ${{ vars.OPENHANDS_MACRO || '@openhands-agent' }}
      max_iterations: ${{ vars.OPENHANDS_MAX_ITER || 50 }}
      LLM_MODEL: ${{ vars.LLM_MODEL || 'deepseek/deepseek-chat' }}
      target_branch: main
      pr_type: draft
    secrets:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
